info:
  name: Search Google Sheet
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:4200/api/google-sheets/1843958344/search?q=salvador
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function() {
          expect(res.status).to.equal(200);
        });

        test("should return a successful JSend response", function() {
          expect(res.body.status).to.equal("success");
          expect(res.body.data).to.be.an("object");
        });

        test("should return google sheet search data", function() {
          expect(res.body.data.spreadsheet_id).to.be.a("string");
          expect(res.body.data.sheet_id).to.equal(1843958344);
          expect(res.body.data.search).to.equal("salvador");
          expect(res.body.data.total).to.be.a("number");
          expect(res.body.data.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
