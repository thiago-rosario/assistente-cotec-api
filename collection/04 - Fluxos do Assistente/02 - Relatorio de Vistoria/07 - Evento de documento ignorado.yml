info:
  name: Evento de documento ignorado
  type: http
  seq: 7
  tags:
    - whatsapp
    - flow
    - report
    - ignored

http:
  method: POST
  url: "{{base_url}}/api/whatsapp/messages"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "message": "",
        "type": "document",
        "phone": "{{test_phone}}",
        "sender_name": "{{test_sender_name}}",
        "external_id": "bruno-report-document-{{$randomUUID}}",
        "source": "manual_staging_test"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should ignore a document event without text", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("success");
          expect(res.body.data.accepted).to.equal(false);
          expect(res.body.data.ignored).to.equal(true);
        });

settings:
  encodeUrl: false
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Evento de documento

  A rota atual recebe e processa conteúdo textual. Este request documenta o comportamento de um evento sem texto: ele é ignorado e não faz upload de arquivo.
