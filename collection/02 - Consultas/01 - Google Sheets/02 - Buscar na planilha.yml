info:
  name: Buscar na planilha
  type: http
  seq: 2
  tags:
    - google-sheets
    - search

http:
  method: GET
  url: "{{base_url}}/api/google-sheets/{{sheet_id}}/search"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: q
      value: "{{google_sheet_query}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function() {
          expect(res.status).to.equal(200);
        });

        test("should return a successful JSend response", function() {
          expect(res.body.status).to.equal("success");
          expect(res.body.data).to.be.an("object");
        });

        test("should return google sheet search data", function() {
          expect(res.body.data.spreadsheet_id).to.be.a("string");
          expect(res.body.data.sheet_id).to.equal(2106669123);
          expect(res.body.data.search).to.equal("salvador");
          expect(res.body.data.total).to.be.a("number");
          expect(res.body.data.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Buscar na planilha

  Busca um termo na aba identificada por `sheet_id`.
