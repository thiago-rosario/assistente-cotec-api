info:
  name: Resumo da planilha
  type: http
  seq: 1
  tags:
    - smoke
    - google-sheets

http:
  method: GET
  url: "{{base_url}}/api/google-sheet"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function() {
          expect(res.status).to.equal(200);
        });

        test("should return a successful JSend response", function() {
          expect(res.body.status).to.equal("success");
          expect(res.body.data).to.be.an("object");
        });

        test("should return spreadsheet summary", function() {
          expect(res.body.data.spreadsheet_id).to.be.a("string");
          expect(res.body.data.total_sheets).to.be.a("number");
          expect(res.body.data.total_rows).to.be.a("number");
          expect(res.body.data.sheets).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Resumo da planilha

  Retorna um resumo da planilha configurada na API.
