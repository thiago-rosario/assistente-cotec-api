info:
  name: Buscar por processo SEI
  type: http
  seq: 2
  tags:
    - technical-notebooks
    - search

http:
  method: GET
  url: "{{base_url}}/api/technical-notebooks/search"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: process
      value: "{{technical_notebook_process}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function() {
          expect(res.status).to.equal(200);
        });

        test("should return a successful JSend response", function() {
          expect(res.body.status).to.equal("success");
          expect(res.body.data).to.be.an("object");
        });

        test("should return technical notebook process search data", function() {
          expect(res.body.data.term).to.equal(null);
          expect(res.body.data.total).to.be.a("number");
          expect(res.body.data.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Buscar cadernos técnicos por processo SEI

  Use a variável `technical_notebook_process` para alterar o processo consultado.
