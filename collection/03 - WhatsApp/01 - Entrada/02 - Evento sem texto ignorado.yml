info:
  name: Evento sem texto ignorado
  type: http
  seq: 2
  tags:
    - whatsapp
    - ignored

http:
  method: POST
  url: "{{base_url}}/api/whatsapp/messages"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "message": "",
        "phone": "{{test_phone}}",
        "sender_name": "{{test_sender_name}}",
        "external_id": "bruno-empty-{{$randomUUID}}",
        "source": "manual_staging_test"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200 for an ignored event", function() {
          expect(res.status).to.equal(200);
        });

        test("should explain that the message content is missing", function() {
          expect(res.body.status).to.equal("success");
          expect(res.body.data.accepted).to.equal(false);
          expect(res.body.data.ignored).to.equal(true);
          expect(res.body.data.reason).to.equal("missing_message_content");
        });

settings:
  encodeUrl: false
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Evento sem texto

  Simula um webhook sem conteúdo textual. A API responde `200` e não cria um job na fila.
