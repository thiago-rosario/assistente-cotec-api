info:
  name: Receber mensagem assíncrona
  type: http
  seq: 1
  tags:
    - whatsapp
    - async
    - smoke

http:
  method: POST
  url: "{{base_url}}/api/whatsapp/messages"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "message": "Olá",
        "phone": "{{test_phone}}",
        "sender_name": "{{test_sender_name}}",
        "external_id": "bruno-greeting-{{$randomUUID}}",
        "source": "manual_staging_test"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 202 Accepted", function() {
          expect(res.status).to.equal(202);
        });

        test("should acknowledge the queued message", function() {
          expect(res.body.status).to.equal("success");
          expect(res.body.data.accepted).to.equal(true);
          expect(res.body.data.duplicate).to.equal(false);
          expect(res.body.data.external_id).to.be.a("string");
        });

settings:
  encodeUrl: false
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Entrada assíncrona do WhatsApp

  Este request apenas aceita o webhook e coloca o processamento na fila. O texto final do assistente não volta na resposta do Bruno.

  A resposta é enviada posteriormente pelo worker para `EDITACODIGO_BOT_WEBHOOK_URL`. Portanto, `202 Accepted` confirma o enfileiramento, não a entrega da mensagem.

  O `external_id` usa `{{$randomUUID}}` para evitar o retorno `duplicate: true` em execuções repetidas.
