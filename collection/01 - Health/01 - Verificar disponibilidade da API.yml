info:
  name: Verificar disponibilidade da API
  type: http
  seq: 1
  tags:
    - smoke
    - health

http:
  method: GET
  url: "{{base_url}}/up"
  headers:
    - name: Accept
      value: text/plain
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Health check

  Verifica se a aplicação Laravel está acessível. Este request não testa a fila nem a integração de saída do WhatsApp.
