  <path class="arrow" d="M132.5 1464 C132.5 1510 430 1490 600 1530" />
  <path class="arrow" d="M367.5 1464 C367.5 1505 500 1498 600 1530" />
  <path class="arrow" d="M602.5 1464 L600 1530" />
  <path class="arrow" d="M837.5 1464 C837.5 1505 700 1498 600 1530" />
  <path class="arrow" d="M1072.5 1464 C1072.5 1660 840 1788 600 1815" />

  <path class="arrow" d="M600 1588 L600 1625" />
