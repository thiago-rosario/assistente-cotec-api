x-laravel-environment: &laravel-environment
  APP_URL: ${APP_URL:-http://localhost:4200}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-assistente_cotec_api}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

x-laravel-volumes: &laravel-volumes
  - .:/var/www/html
  - public-storage:/var/www/html/storage/app/public

services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes: *laravel-volumes

  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    command: >-
      /bin/sh -lc 'until php artisan migrate:status --no-interaction 2>/dev/null | grep -Eq
      "0001_01_01_000002_create_jobs_table.*Ran"; do sleep 2; done; exec php artisan
      queue:work --verbose --tries=3 --timeout=150 --sleep=3 --no-interaction'
    env_file:
      - .env
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes: *laravel-volumes

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./public:/var/www/html/public:ro
      - public-storage:/var/www/html/storage/app/public:ro

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-assistente_cotec_api}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-assistente_cotec_api}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  public-storage:
